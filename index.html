<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Valentine ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            overflow-x: hidden;
        }

        /* 🌸 Floating sparkles */
        .sparkle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, .8);
            border-radius: 50%;
            animation: sparkle 8s linear infinite;
        }

        @keyframes sparkle {
            from {
                transform: translateY(100vh);
                opacity: 1;
            }

            to {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        /* HEADER */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            animation: fadeIn 2s ease;
        }

        header p {
            margin-top: 15px;
            font-size: 1.2rem;
        }

        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: #ff4b5c;
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: .3s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        /* SECTION */
        section {
            padding: 60px 20px;
            text-align: center;
        }

        section h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            font-family: 'Great Vibes', cursive;
        }

        /* 🌿 HANGING GALLERY */
        .hanging-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 45px;
        }

        .photo {
            position: relative;
            width: 240px;
            background: #fff;
            padding: 12px 12px 22px;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .45);
            transform-origin: top center;
            animation: swing 4s ease-in-out infinite;
        }

        /* rope */
        .photo::before {
            content: "";
            position: absolute;
            top: -40px;
            left: 50%;
            width: 3px;
            height: 40px;
            background: #fff;
            transform: translateX(-50%);
        }

        /* 💖 heart pin */
        .photo::after {
            content: "❤️";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        /* image */
        .photo img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: .4s;
        }

        .photo:hover img {
            transform: scale(1.08);
        }

        /* caption */
        .photo span {
            display: block;
            margin-top: 10px;
            color: #ff4b5c;
            font-weight: 600;
        }

        /* swing */
        @keyframes swing {
            0% {
                transform: rotate(2deg);
            }

            50% {
                transform: rotate(-2deg);
            }

            100% {
                transform: rotate(2deg);
            }
        }

        /* MESSAGE */
        .message {
            max-width: 700px;
            margin: auto;
            font-size: 1.1rem;
            line-height: 1.8;
            min-height: 120px;
        }

        /* FOOTER */
        footer {
            padding: 30px;
            text-align: center;
            background: rgba(0, 0, 0, .2);
        }

        /* HEARTS */
        .heart {
            position: fixed;
            bottom: 0;
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 📱 MOBILE */
        @media(max-width:480px) {
            header h1 {
                font-size: 2.6rem;
            }

            section h2 {
                font-size: 2rem;
            }

            .photo {
                width: 190px;
            }

            .photo img {
                height: 250px;
            }
        }

        .explore-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #ff6f91;
            border-radius: 30px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .explore-btn:hover {
            transform: scale(1.1);
            background: #ff4b5c;
        }
    </style>
</head>

<body>

    <header>
        <h1>Happy Valentine’s Day Babe❤️</h1>
        <p>To the one who makes my world beautiful</p>
        <button class="btn" onclick="scrollToGallery()">Babe Click Here 💞</button>
    </header>

    <section id="gallery">
        <h2>Our Hanging Memories 🌸</h2>

        <div class="hanging-gallery">
            <div class="photo">
                <img src="images/pic1.jpg">
                <span>Our First Smile 💕</span>
            </div>

            <div class="photo">
                <img src="images/pic2.jpg">
                <span>Unforgettable Day ❤️</span>
            </div>

            <div class="photo">
                <img src="images/pic3.jpg">
                <span>Forever Us 💞</span>
            </div>
        </div>
        <button class="btn explore-btn" style="margin-top:80px;" onclick="openQuiz()">
            Thangoo Click Me to see our Memories💖
        </button>

    </section>

    <section>
        <h2>My Message to You 💌</h2>
        <p class="message" id="typeText"></p>

    </section>


    <footer>
        Made with ❤️ by Divya Baskar
    </footer>
    <!-- 💖 LOVE QUESTIONS MODAL -->
    <div id="quizModal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:999;">

        <div
            style="background:#fff; color:#333; padding:30px; border-radius:20px; width:90%; max-width:450px; text-align:center;">

            <h3 id="questionText"></h3>

            <input type="text" id="answerInput" placeholder="Type your answer here ❤️"
                style="margin-top:20px; padding:10px; width:100%; border-radius:20px; border:1px solid #ccc;">

            <button onclick="nextQuestion()"
                style="margin-top:20px; padding:10px 25px; border:none; border-radius:25px; background:#ff4b5c; color:#fff; cursor:pointer;">
                Next 💕
            </button>

        </div>
    </div>


   <script type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>


    <script>
       emailjs.init({
    publicKey: "tIg4g5ci_LL0_K2-v"
});

    </script>

    <script>
        function scrollToGallery() {
            document.getElementById("gallery").scrollIntoView({ behavior: "smooth" });
        }

        /* hearts */
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 700);

        /* sparkles */
        setInterval(() => {
            const s = document.createElement("div");
            s.className = "sparkle";
            s.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 8000);
        }, 500);

        /* typewriter */
        const text = `You are not just my love, you are my happiness, my peace and my forever.
Every moment with you is special.
I love you endlessly ❤️`;

        let i = 0;
        function type() {
            if (i < text.length) {
                document.getElementById("typeText").innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 50);
            }
        }
        type();

    
        const questions = [
            "First answer pannu… apram dhaan namma memories paaka mudiyum 😌💖En question konjam crige ah the eruku,but Serious ah answer pannu sariya babe? 💕\n\n1. Enna unakku evlo pudikkum? Enna evlo love panra? and Babe, naan un life la evlo important person nu therinchikalama?💕",

            "2. Babe, enna en babe love panna unmayana reason sollu and Ena en da love panonu feel panirukiya athu en nu sollu? 💖✨",

            "3. Na un life la vanthathuku aprm yantha moment la en koda romba happy ah eruntha and yantha moment la sad da eruntha enala? 💍🥰",
            
            "4. Babe, Yantha point la ne feel panna enna miss panirava kodathunu ?🥺❤️",

            "5. Enakaga oru promise pananuna ena panuva and i want to know overall things ne enna sollanunu nianikiranu ena pathi and namma love pathi ..solriya please? ❤️🤞"
        ];

        let currentQuestion = 0;
        let answers = [];

        function openQuiz() {
            document.getElementById("quizModal").style.display = "flex";
            showQuestion();
        }

        function showQuestion() {
            document.getElementById("questionText").innerText = questions[currentQuestion];
            document.getElementById("answerInput").value = "";
        }

        function nextQuestion() {

            const answer = document.getElementById("answerInput").value.trim();

            if (answer === "") {
                alert("Answer type pannu da kutty 😌❤️");
                return;
            }

            answers.push(answer);
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                // cute loading effect
                document.getElementById("questionText").innerText = "Loading our beautiful memories... 💖";
                document.getElementById("answerInput").style.display = "none";

                emailjs.send("service_s4ouh5o", "template_b4pzm1l", {
                    q1: answers[0],
                    q2: answers[1],
                    q3: answers[2],
                    q4: answers[3],
                    q5: answers[4]
                }).then(function (response) {

                    document.getElementById("questionText").innerText = "Sending love answers... 💌";
                    document.getElementById("answerInput").style.display = "none";

                    setTimeout(() => {
                        window.location.href = "memories.html";
                    }, 2000);

                }, function (error) {
                    alert("Something went wrong 😢");
                });

            }
        }


    </script>



</body>

</html>
